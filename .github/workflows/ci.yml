name: IntentMesh Protocol CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Audit & Test IntentMesh Protocol
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Solidity Formatting Check
        run: |
          cd contracts
          forge fmt --check

      - name: Build Smart Contracts
        run: |
          cd contracts
          forge build

      - name: Run Foundry Unit & Invariant Tests
        run: |
          cd contracts
          forge test -vvv

      - name: Compile Workspace TypeScript Packages
        run: |
          npx tsc --build --force packages/protocol-types packages/intent-schema packages/solver-sdk packages/risk-engine packages/chain-adapters packages/verification-sdk services/execution-monitor services/failure-manager services/indexer apps/api solvers

      - name: Run Master End-to-End MVP Test Suite
        run: |
          node scratch/run_e2e_mvp_test.js

      - name: Build Web Frontend Dashboard
        run: |
          pnpm --filter @intentmesh/web build
